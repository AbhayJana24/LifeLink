name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests (compatibility, eligibility, geo, phone)
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js production bundle
        run: npm run build
        env:
          BETTER_AUTH_SECRET: "ci-build-test-secret-key-0123456789abcdef"
          BETTER_AUTH_URL: "http://localhost:3000"
